<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — SkillSwap</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body ng-app="skillSwapApp">
  <div class="center-screen">
    <div class="auth-box">
      <button class="back-link" onclick="window.location.href='index.html'">← Back</button>
      <div class="card">
        <div class="tabs">
          <button class="active" onclick="window.location.href='login.html'">Log in</button>
          <button onclick="window.location.href='register.html'">Register</button>
        </div>
        <form id="loginForm">
          <label class="field"><span class="label">Email</span><input class="input" type="email" id="email"
              placeholder="you@example.com" required></label>
          <label class="field"><span class="label">Password</span><input class="input" type="password" id="password"
              placeholder="••••••••" required></label>
          <div id="errBox"></div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
        <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);">
          <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;">QUICK DEMO LOGIN</div>
          <div id="demoLogins" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="js/angular-app.js"></script>
  <script src="js/factories.js"></script>
  <script src="js/services.js"></script>
  <script src="js/business-rules.js"></script>
  <script>
    refreshDB();
    const demoBox = document.getElementById("demoLogins");
    DB.students.slice(0, 4).forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s.name.split(" ")[0] + " (" + s.code + ")";
      b.style.cssText = "font-size:11.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper-alt);cursor:pointer;color:var(--pine-dark);font-weight:600;";
      b.addEventListener("click", () => {
        setSession({ role: "student", id: s.id });
        window.location.href = "dashboard.html";
      });
      demoBox.appendChild(b);
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const s = DB.students.find((s) => s.email.toLowerCase() === email && s.password === password);
      const errBox = document.getElementById("errBox");
      if (!s) { errBox.innerHTML = bannerHtmlInline("No account matches that email and password."); return; }
      setSession({ role: "student", id: s.id });
      window.location.href = "dashboard.html";
    });
    function bannerHtmlInline(text) { return `<div class="banner-error">${text}</div>`; }
  </script>
</body>

</html>
